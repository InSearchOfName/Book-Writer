name: Bug report
description: Something in the mod isn't working
labels: ["bug"]
body:
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "26.2"
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: "1.1.1"
    validations:
      required: true
  - type: input
    id: dependency-versions
    attributes:
      label: Fabric Loader, Fabric API and owo-lib versions
      placeholder: "Loader 0.19.3, Fabric API 0.154.2+26.2, owo-lib 0.13.1+26.2"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include your GUI scale if the problem is about the screen layout.
      placeholder: |
        1. Open your inventory with writable books
        2. Type `.write`
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste the relevant part of `latest.log` or drag in a screenshot.
