name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # per-Minecraft-version branches: year.release (26.1) or major.minor.patch (1.20.4)
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud needs the full history to blame new code
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew build -x test

      - name: SonarCloud analysis
        # secrets aren't exposed to pull requests from forks
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar
