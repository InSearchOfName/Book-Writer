name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # per-Minecraft-version branches: {minecraft version}-v{major}, e.g. 26.1-v1
      - "[0-9]+.[0-9]+-v[0-9]+"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: book-writer-jars
          path: build/libs/*.jar
          if-no-files-found: error
