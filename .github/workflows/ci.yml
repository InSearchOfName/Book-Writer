name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # per-Minecraft-version branches: {minecraft version without patch}, e.g. 26.1
      - "[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew build -x test


  client-game-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Client game test
        run: xvfb-run -a ./gradlew runClientGameTest

      - name: Upload game logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-logs
          path: |
            build/run/clientGameTest/logs
            build/run/clientGameTest/crash-reports
          if-no-files-found: ignore
